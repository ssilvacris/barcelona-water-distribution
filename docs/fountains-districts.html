
   <!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8" />
  <title>Fonts d'aigua Barcelona 2025</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    crossorigin=""
  />
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; display: flex; height: 100vh; }
    #sidebar { width: 280px; border-right: 1px solid #ddd; padding: 1rem; background: #fafafa; overflow-y: auto; }
    #map { flex: 1; }
    .fountain-list { margin-top: 1rem; max-height: 40vh; overflow-y: auto; border-top: 1px solid #eee; padding-top: .5rem; }
    .fountain-item { font-size: .85rem; margin-bottom: .5rem; cursor: pointer; }
    .small { font-size: .75rem; color: #555; }
    button { margin-bottom: .7rem; padding: .4rem .6rem; border: 1px solid #ccc; background: white; cursor: pointer; border-radius: 4px; }
  </style>
</head>
<body>
  <div id="sidebar">
    <h1>Fonts d'aigua BCN (2025)</h1>
    <p class="small">Dades: Open Data Barcelona.</p>

    <label for="districtFilter">Filtrar per districte</label>
    <select id="districtFilter">
      <option value="">— Tots —</option>
    </select>

    <button id="locateBtn">📍 Mostrar font més propera</button>
    <p id="nearestInfo" class="small"></p>

    <div class="fountain-list" id="fountainList"></div>
  </div>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script>
    // 1) se puder, usa o arquivo COM distrito
    const CSV_FILE = '2025_fonts_beure_with_district.csv'; 
    // se o teu nome for outro, troca aqui ↑

    const codeToDistrict = {
      "01": "Ciutat Vella",
      "02": "Eixample",
      "03": "Sants-Montjuïc",
      "04": "Les Corts",
      "05": "Sarrià-Sant Gervasi",
      "06": "Gràcia",
      "07": "Horta-Guinardó",
      "08": "Nou Barris",
      "09": "Sant Andreu",
      "10": "Sant Martí",
    };

    const map = L.map('map').setView([41.387, 2.17], 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    let allFountains = [];
    let markersLayer = L.layerGroup().addTo(map);

    fetch(CSV_FILE)
      .then(res => res.text())
      .then(csvText => {
        Papa.parse(csvText, {
          header: true,
          skipEmptyLines: true,
          complete: function(results) {
            allFountains = results.data
              .filter(r => r.LATITUD && r.LONGITUD)
              .map(r => {
                // tenta pegar distrito direto do CSV
                let district = r.DISTRICTE || r.DISTRICT || "";
                // se não tiver, tenta derivar do código
                if (!district && r.CODI) {
                  const prefix = r.CODI.split('-')[0];
                  district = codeToDistrict[prefix] || "";
                }
                return {
                  code: r.CODI,
                  name: r.NOM,
                  street: r.CARRER,
                  num: r.NUMERO_CARRER,
                  lat: parseFloat(r.LATITUD),
                  lon: parseFloat(r.LONGITUD),
                  district: district
                };
              });

            renderFountains();
            populateDistrictFilter();
          }
        });
      })
      .catch(err => console.error("Erro ao carregar CSV:", err));

    function renderFountains(selectedDistrict = "") {
      markersLayer.clearLayers();
      const listEl = document.getElementById('fountainList');
      listEl.innerHTML = "";

      const filtered = selectedDistrict
        ? allFountains.filter(f => f.district === selectedDistrict)
        : allFountains;

      filtered.forEach(f => {
        const marker = L.marker([f.lat, f.lon]).addTo(markersLayer);
        marker.bindPopup(`<b>${f.name || "Font"}</b><br>${f.street || ""} ${f.num || ""}<br><i>${f.district || ""}</i>`);

        const item = document.createElement('div');
        item.className = 'fountain-item';
        item.textContent = f.name ? f.name : `Font ${f.code}`;
        item.onclick = () => {
          map.setView([f.lat, f.lon], 17);
          marker.openPopup();
        };
        listEl.appendChild(item);
      });

      if (filtered.length > 0) {
        const bounds = L.latLngBounds(filtered.map(f => [f.lat, f.lon]));
        map.fitBounds(bounds, { padding: [20, 20] });
      }
    }

    function populateDistrictFilter() {
      const select = document.getElementById('districtFilter');
      const districts = Array.from(new Set(
        allFountains.map(f => f.district).filter(Boolean)
      )).sort();
      districts.forEach(d => {
        const opt = document.createElement('option');
        opt.value = d;
        opt.textContent = d;
        select.appendChild(opt);
      });
    }

    document.getElementById('districtFilter').addEventListener('change', (e) => {
      renderFountains(e.target.value);
    });

    // geolocalização
    document.getElementById('locateBtn').addEventListener('click', () => {
      if (!navigator.geolocation) {
        alert("Geolocalização não suportada.");
        return;
      }
      navigator.geolocation.getCurrentPosition(pos => {
        const userLat = pos.coords.latitude;
        const userLon = pos.coords.longitude;
        L.circleMarker([userLat, userLon], { radius: 6, color: 'blue' })
          .addTo(map).bindPopup("Você está aqui").openPopup();
        map.setView([userLat, userLon], 14);

        const nearest = findNearestFountain(userLat, userLon, allFountains);
        if (nearest) {
          L.polyline([[userLat, userLon], [nearest.lat, nearest.lon]], {color: 'blue', dashArray: '4'}).addTo(map);
          document.getElementById('nearestInfo').textContent =
            `Fonte mais próxima: ${nearest.name || nearest.code} – ${nearest.distance.toFixed(0)} m (${nearest.district || "—"})`;
          L.marker([nearest.lat, nearest.lon])
            .addTo(map)
            .bindPopup(`<b>${nearest.name || "Font"}</b><br>${nearest.street || ""} ${nearest.num || ""}<br><i>${nearest.district || ""}</i>`)
            .openPopup();
        }
      });
    });

    function findNearestFountain(lat, lon, fountains) {
      let nearest = null;
      let minDist = Infinity;
      fountains.forEach(f => {
        const d = haversine(lat, lon, f.lat, f.lon);
        if (d < minDist) {
          minDist = d;
          nearest = {...f, distance: d};
        }
      });
      return nearest;
    }

    function haversine(lat1, lon1, lat2, lon2) {
      const R = 6371e3;
      const toRad = deg => deg * Math.PI / 180;
      const dLat = toRad(lat2 - lat1);
      const dLon = toRad(lon2 - lon1);
      const a = Math.sin(dLat/2)**2 +
                Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
                Math.sin(dLon/2)**2;
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return R * c;
    }
  </script>
</body>
</html>
