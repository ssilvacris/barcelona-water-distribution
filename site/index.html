<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8" />
  <title>Fonts d'aigua Barcelona 2025</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    crossorigin=""
  />

  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/styles.css" />

  <!-- PapaParse -->
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e88e5">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <!-- PWA Configuration -->
  <link rel="manifest" href="/barcelona-water-distribution/manifest.json">
  <meta name="theme-color" content="#1e88e5">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BCN Water">

  <!-- Register Service Worker -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/barcelona-water-distribution/service-worker.js')
          .then(registration => {
            console.log('Service Worker registrado com sucesso!', registration);
          })
          .catch(error => {
            console.log('Erro ao registrar Service Worker:', error);
          });
      });
    }
  </script>
</head>

<body>
  <div id="sidebar">
    <h1>Fonts d'aigua BCN (2025)</h1>
    <p class="small">Dades: Open Data Barcelona</p>

    <label for="districtFilter">Filtrar per districte</label>
    <select id="districtFilter">
      <option value="">— Tots —</option>
    </select>

    <button id="locateBtn">Mostrar font més propera</button>
    <p id="nearestInfo" class="small"></p>

    <div class="fountain-list" id="fountainList"></div>
  </div>

  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

  <!-- Custom JS -->
  <script src="js/script.js"></script>

  <script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
  }
  </script>
</body>
</html>
